<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0a0a;
        --ink: #f5f5f5;
        --threat: #ff3b30;
        --safe: #34c759;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; background: var(--ground); font-family: Inter, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="threat" data-composition-id="threat" data-composition-src="compositions/threat.html"
           data-start="4.5" data-duration="8.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
           data-start="13" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="compare" data-composition-id="compare" data-composition-src="compositions/compare.html"
           data-start="15.5" data-duration="11.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="facts" data-composition-id="facts" data-composition-src="compositions/facts.html"
           data-start="27" data-duration="5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="32" data-duration="4" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
